<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Brave H.C. | Active Streaks and Record Watch</title>
<style>
:root{color-scheme:dark;--ice:#dcecf7;--navy:#061424;--red:#b81725;--gold:#f28d21}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#091521;color:var(--ice);font:12px/1.3 "Arial Narrow",Arial,sans-serif}
.shell{width:100%;max-width:630px;margin:auto;background:#b91928;padding:6px}
.external-title{background:#06080d;color:#fff;text-transform:uppercase;text-align:center;font-size:13px;font-weight:900;padding:5px;letter-spacing:.07em;border-block:2px solid #e5e8ed}
.frame{position:relative;aspect-ratio:625/352;width:100%;background:#030b14 url("./original_HTO_watch_full.png") center top /100% 100% no-repeat;overflow:hidden}
.panel-overlay{position:absolute;top:39.9%;height:39.6%;background:linear-gradient(145deg,#04111e,#061421);overflow:auto;scrollbar-color:#465f78 #071422;scrollbar-width:thin;color:#f4f7fa}
.panel-overlay.left{left:4%;width:45.8%}
.panel-overlay.right{left:52.8%;width:44.4%}
.rows{display:flex;flex-direction:column;height:100%}
.row{display:grid;grid-template-columns:44% 56%;align-items:start;border-bottom:1px solid #1f3244;padding:5px 2px;gap:3px;line-height:1.18;font-size:clamp(7px,1.65vw,10.5px)}
.row:last-child{border-bottom:0}
.row .name{color:#edf2f8;font-weight:700;overflow-wrap:anywhere}
.row .value{color:#e98b29;font-weight:800;overflow-wrap:anywhere}
.empty{min-height:100%;display:flex;justify-content:center;align-items:center;text-align:center;color:#d2dae4;font-size:clamp(8px,1.9vw,12px);padding:10px}
.asof{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 7px 3px;font-size:10px;color:#dbe6f1}
.asof strong{color:#ffdfab}
.asof.is-current strong{color:#c5f6dd}
.asof a{color:#dbe8f7;text-decoration:underline;text-underline-offset:2px;flex-shrink:0}
.error{font-size:11px;color:#ffcfbb}
.embedded{background:transparent}
.embedded .shell{max-width:none;padding:4px}
.embedded .external-title{display:none}
@media(max-width:480px){
 .shell{padding:4px}
 .row{font-size:clamp(6.6px,2.05vw,8px);padding:3px 1px;line-height:1.12;gap:2px}
 .row .name{font-weight:650}
 .row .value{font-weight:750}
 .empty{font-size:clamp(7.1px,2.1vw,9px);padding:4px}
 .asof{font-size:8px;padding:5px 3px 4px;line-height:1.3}
}
</style>
</head>
<body>
<div class="shell">
<header class="external-title">Active Streaks &amp; Record Watch</header>
<main class="frame" aria-label="Brave H.C. active streaks and record-watch dashboard">
<section class="panel-overlay left" aria-label="Active streaks"><div class="rows" id="streaks"><div class="empty">Loading streaks…</div></div></section>
<section class="panel-overlay right" aria-label="Career record watch"><div class="rows" id="records"><div class="empty">Loading records…</div></div></section>
</main>
<footer class="asof" id="statusbar">
<strong id="status" role="status">Checking workbook records…</strong>
<a id="source" href="https://www.htosports.com/teams/default.asp?p=stats&amp;s=hockey&amp;u=BRAVESHOCKEY" target="_blank" rel="noopener noreferrer">HTO stats ↗</a>
</footer>
</div>
<script>
(function(){
"use strict";
if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("embedded");
const locations={streaks:document.getElementById("streaks"),records:document.getElementById("records")};
function fill(kind,items,verified){
 const target=locations[kind];
 target.replaceChildren();
 if(!items.length){
  const none=document.createElement("div");none.className="empty";
  none.textContent=verified?(kind==="streaks"?"No active streaks":"No current record watches")
     :(kind==="streaks"?"No active streaks":"No record watches in saved workbook");
  target.appendChild(none);return;
 }
 for(const item of items.slice(0,10)){
  if(!item.player||!item.description)continue;
  const row=document.createElement("div");row.className="row";
  const name=document.createElement("span");name.className="name";name.textContent=item.player;
  const value=document.createElement("span");value.className="value";value.textContent=item.description.replace(/;\s*$/,"");
  row.append(name,value);target.appendChild(row);
 }
}
function show(d){
 if(d.schema!=="brave-hc-workbook-watch/v2"||!Array.isArray(d.streaks)||!Array.isArray(d.records))
    throw Error("Unexpected workbook watch schema");
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.workbookAsOf)||d.records.length>12||d.streaks.length>12)
    throw Error("Missing provenance or unexpected watch size");
 fill("streaks",d.streaks,d.sourceValidated===true);
 fill("records",d.records,d.sourceValidated===true);
 const historical=d.dataStatus!=="VERIFIED_CURRENT"||d.sourceValidated!==true;
 const date=new Intl.DateTimeFormat("en-CA",{month:"short",day:"numeric",year:"numeric",timeZone:"America/Toronto"}).format(new Date(d.workbookAsOf+"T12:00:00Z"));
 document.getElementById("status").textContent=historical
   ?("HISTORICAL WORKBOOK · "+date+" · game-level refresh pending")
   :("VERIFIED WORKBOOK · "+date+" · latest game reconciled");
 document.getElementById("statusbar").classList.toggle("is-current",!historical);
}
async function refresh(){
 try{
  const r=await fetch("./watch.json",{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  show(await r.json());
 }catch(error){
  const status=document.getElementById("status");
  status.textContent="Unable to verify current workbook watch data; saved results retained";
  status.classList.add("error");
 }
}
refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh()},300000);
})();
</script>
</body></html>
