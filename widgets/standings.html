<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Brave H.C. | Cristillo Division Standings</title>
<style>
:root{color-scheme:dark;--ink:#f5f8fc;--navy:#061426;--ice:#aec5dc;--red:#b60c22}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font:12px/1.25 Arial,"Arial Narrow",sans-serif;background:#0b182a;color:var(--ink)}
.shell{width:100%;max-width:630px;margin:0 auto;padding:7px;background:linear-gradient(135deg,#841724,#cb1727 35%,#a80d1f 75%,#5c0c16);border:1px solid #b8c4d0}
.outer-title{background:#050608;border-block:2px solid #f0f2f7;text-align:center;font-weight:900;padding:5px 4px;letter-spacing:.07em;text-transform:uppercase;font-size:13px}
.panel{background:radial-gradient(ellipse at 50% 0%,#1a3653,#071528 75%);border:2px solid #8da6bd;padding:5px;box-shadow:inset 0 0 0 1px #d4e0ea}
.header-art{position:relative;width:100%;aspect-ratio:625/79;background:url("./original_HTO_standings_header.png") center top / 100% auto no-repeat;overflow:hidden}
.header-art .live-date{position:absolute;left:1.7%;top:17%;width:18.6%;height:58%;background:linear-gradient(92deg,#091c31 85%,#102d48 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.live-date b{display:block;font:900 clamp(7px,1.65vw,12px)/1.05 "Arial Narrow",Arial,sans-serif;white-space:nowrap;letter-spacing:-.025em}
.live-date span{font-size:clamp(5.4px,.92vw,7.3px);font-weight:700;color:#bed3e7;letter-spacing:.1em;border-top:2px solid #db1d30;padding-top:3px}
.table-holder{border:2px solid #91a9bf;background:#061526;overflow-x:auto;scrollbar-color:#7b90a3 #061526}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
table th{height:28px;font:800 11px/1.05 "Arial Narrow",Arial,sans-serif;background:linear-gradient(#0c2946,#07182c);text-transform:uppercase;color:#e5edf8;white-space:nowrap;border:1px solid #728ca5;padding:4px 2px}
table td{font:700 11px/1.1 "Arial Narrow",Arial,sans-serif;color:#f3f8fc;border:1px solid #56738f;background:linear-gradient(#0a2139,#061426);height:28px;text-align:center;padding:5px 2px;white-space:nowrap}
table .team-name{text-align:left;padding-left:7px;overflow:hidden;text-overflow:clip;font-weight:800;text-transform:uppercase}
tbody tr.brave td{background:linear-gradient(180deg,#b9071e 0%,#6b0611 48%,#8b0718 100%);border-color:#d75262;color:#fff;text-shadow:0 1px #150609}
tbody tr.brave .team-name{font-weight:900}
tbody tr:hover:not(.brave) td{background:#153b59}
.place{width:8%}.team{width:31%}.stat7{width:7%}.stat6{width:6%}.pct{width:13%}
.source-line{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 5px 2px;font-size:9px;color:#d4e3f0}
.source-line a{color:#e8f4ff;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.source-line .status{font-size:8.5px;text-align:right}
.source-line.stale .status{color:#fcd6a9}
.footer-rule{height:5px;margin:5px 0 0;background:linear-gradient(90deg,#102b46,#cedee9 15%,#ab1826 30%,#e9f3f9 33%,#0e2946 42%,#0e2946 58%,#e9f3f9 66%,#ab1826 70%,#d4e4ef 82%,#102b46);border-block:1px solid #506c86}
.failure{color:#ffdbd8;padding:12px;background:#3c1821;border:1px solid #ad5d6a;margin:4px}
.embedded .outer-title{display:none}
.embedded{background:transparent}
.embedded .shell{max-width:none;border:0;padding:5px}
@media(max-width:480px){
 .outer-title{font-size:11px}
 .shell{padding:5px}
 .panel{padding:3px}
 table th{font-size:7.7px;height:25px;padding:3px 1px;letter-spacing:-.02em}
 table td{font-size:8.8px;height:25px;padding:4px 1px}
 table .team-name{font-size:8.25px;padding-left:3px}
 .team{width:32%}.place{width:8%}.stat7{width:7%}.stat6{width:6%}.pct{width:12%}
 .live-date b{font-size:clamp(6px,1.9vw,8px)}
 .live-date span{font-size:clamp(4.3px,1.24vw,5.6px);letter-spacing:.02em;padding-top:2px;border-top-width:1px}
 .source-line{font-size:8px;padding:5px 2px 2px}
 .source-line .status{font-size:7.4px}
 .header-art .live-date{gap:1px}
}
</style>
</head>
<body>
<div class="shell">
<header class="outer-title">Cristillo Division Standings</header>
<main class="panel">
<div class="header-art" role="img" aria-label="Brave H.C. SVHL Winter 2026/27, Cristillo Division regular-season standings">
<div class="live-date"><b id="asofDate">LOADING</b><span>SVHL STANDINGS</span></div>
</div>
<div class="table-holder">
<table aria-label="SVHL Winter 2026/27 Cristillo Division standings">
<colgroup>
<col class="place"><col class="team"><col class="stat7"><col class="stat6"><col class="stat6">
<col class="stat6"><col class="stat7"><col class="stat6"><col class="stat6"><col class="pct">
</colgroup>
<thead><tr><th scope="col">PLACE</th><th scope="col">TEAM</th><th scope="col">GP</th>
<th scope="col">W</th><th scope="col">L</th><th scope="col">T</th><th scope="col">PTS</th>
<th scope="col">GF</th><th scope="col">GA</th><th scope="col" title="Winning percentage">WIN %</th></tr></thead>
<tbody id="rows"><tr><td colspan="10">Loading league standings…</td></tr></tbody>
</table>
</div>
<div class="footer-rule" aria-hidden="true"></div>
<div class="source-line" id="sourceBar">
<a id="league" href="https://leagues.sportsvillage.ca/Leagues.aspx?leagueid=570&amp;page_type=Adult&amp;sc=HOCKEY" target="_blank" rel="noopener noreferrer">SVHL official standings ↗</a>
<span class="status" id="status" role="status">Checking source timestamp</span>
</div>
</main>
</div>
<script>
(function(){
"use strict";
if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("embedded");
const target=document.getElementById("rows");
const current=document.getElementById("status");
function td(value,name){
 const e=document.createElement("td");e.textContent=String(value);
 if(name)e.className=name;return e;
}
function rankFor(teams,team){
 // Competition rank based on points only; do not silently invent league tie-break rules.
 return 1+teams.filter(x=>x.pts>team.pts).length;
}
function display(d){
 if(d.schema!=="brave-hc-svhl-standings/v1"||d.division!=="Cristillo"||!Array.isArray(d.teams)||d.teams.length!==8)
  throw Error("Unverified standings data contract");
 if(d.teams.filter(t=>t.name==="Braves HC").length!==1)throw Error("Brave H.C. team missing or repeated");
 if(new Set(d.teams.map(t=>t.name)).size!==d.teams.length)throw Error("Duplicate league team");
 const captured=new Date(d.capturedAt);
 if(isNaN(captured.getTime()))throw Error("Unknown source date");
 if(Date.now()-captured.getTime()< -3600000)throw Error("Source timestamp unexpectedly in future");
 const frag=document.createDocumentFragment();
 d.teams.forEach(function(t){
  for(const k of ["gp","w","l","t","pts","gf","ga","winPct"]){
   if(!Number.isFinite(t[k])||t[k]<0)throw Error("Invalid table statistic");
  }
  if(t.gp!==t.w+t.l+t.t||t.pts!==2*t.w+t.t)throw Error("League points/record mismatch");
  const tr=document.createElement("tr");
  if(t.name==="Braves HC"){tr.className="brave";tr.setAttribute("aria-label","Brave H.C. highlighted");}
  [rankFor(d.teams,t),t.name.toUpperCase(),t.gp,t.w,t.l,t.t,t.pts,t.gf,t.ga,t.winPct.toFixed(3)]
    .forEach((v,i)=>tr.appendChild(td(v,i===1?"team-name":"")));
  frag.appendChild(tr);
 });
 target.replaceChildren(frag);
 document.getElementById("asofDate").textContent=new Intl.DateTimeFormat("en-US",{timeZone:"America/Toronto",month:"short",day:"numeric",year:"numeric"}).format(captured).toUpperCase();
 const stale=(Date.now()-captured.getTime())>48*3600000;
 const stamp=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",hour:"numeric",minute:"2-digit",hour12:true}).format(captured);
 current.textContent=(stale?"OLDER SNAPSHOT · ":"UPDATED · ")+stamp+" ET";
 document.getElementById("sourceBar").classList.toggle("stale",stale);
}
async function refresh(){
 try{
  const response=await fetch("./standings.json",{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  display(await response.json());
 }catch(err){
  current.textContent="Source unavailable · previous data retained";
  document.getElementById("sourceBar").classList.add("stale");
  if(!target.querySelector("tr[data-rendered]")&&target.children.length===1&&target.firstElementChild.textContent.includes("Loading"))
    target.replaceChildren(Object.assign(document.createElement("tr"),{innerHTML:'<td colspan="10">Standings temporarily unavailable. Use official SVHL link.</td>'}));
 }
}
refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh()},300000);
})();
</script>
</body></html>
