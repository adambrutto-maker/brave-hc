name: Save Brave H.C. goalie request
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: brave-hc-goalie-request
  cancel-in-progress: false
jobs:
  save:
    if: github.event.issue.title == 'GOALIE_CONFIRMATION_REQUEST'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate request parser and role rules
        run: python -m unittest discover -s tests -p test_goalie_issue.py
      - name: Verify remote pre-push concurrency protection
        run: python -m unittest discover -s tests -p test_goalie_remote_pre_push.py
      - name: Validate failure feedback uses safe, actionable messages
        run: python -m unittest discover -s tests -p test_goalie_request_feedback.py
      - name: Verify issue author has repository write access and process request
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          issue=event["issue"]
          actor=issue["user"]["login"]
          if actor != event["sender"]["login"]:
              raise RuntimeError("Issue author/sender identity mismatch")
          repo=os.environ["GITHUB_REPOSITORY"]
          url="https://api.github.com/repos/"+repo+"/collaborators/"+actor+"/permission"
          request=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"BraveHC-Goalie-Manager"
          })
          with urllib.request.urlopen(request,timeout=20) as response:
              permission=json.load(response)["permission"]
          if permission not in ("write","maintain","admin"):
              raise PermissionError("Only repository writers may confirm a goalie")
          Path("goalie-request.json").write_text(json.dumps({
              "title":issue["title"],"body":issue.get("body") or ""
          }), encoding="utf-8")
          subprocess.run([
              "python","scripts/process_goalie_issue.py",
              "--request","goalie-request.json","--actor",actor,
              "--permission",permission,
              "--result-file","build/goalie-request-status.json"
          ],check=True)
          PY
      - name: Commit verified goalie assignment (if changed)
        id: commit
        run: |
          git fetch origin main
          python scripts/verify_goalie_push.py --request-file goalie-request.json
          if git diff --quiet -- widgets/goalie-assignments.json; then
            echo "Already confirmed; no assignment write required"
          else
            git config user.name "BruTTech Goalie Manager"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add widgets/goalie-assignments.json
            git commit -m "Confirm Braves goalie from authenticated issue"
            git rebase origin/main
            git push
          fi
      - name: Read back published goalie from GitHub main before closing issue
        id: receipt
        env:
          REQUEST_ACTOR: ${{ github.event.issue.user.login }}
        run: |
          git fetch origin main
          python scripts/verify_goalie_receipt.py \
            --request-file goalie-request.json \
            --result-file build/goalie-request-status.json \
            --actor "$REQUEST_ACTOR" \
            --out build/goalie-receipt.json
      - name: Record completion and close authenticated request
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT="$(python - <<'PY'
          import json
          from pathlib import Path
          item=json.loads(Path("build/goalie-receipt.json").read_text(encoding="utf-8"))
          if item.get("status")!="PUBLISHED_AND_VERIFIED":
              raise SystemExit("Missing verified published goalie receipt")
          print("Published goalie confirmation verified against GitHub main: " +
                item["game_key"] + " — " + item["published_goalie"] +
                " (commit " + item["verified_remote_sha"] + "). " +
                "The reviewed SVHL fixture also matches. Public widget delivery is checked separately.")
          PY
          )"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$COMMENT"

      - name: Provide a safe public reason and recovery instructions when approval fails
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.authorize.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CLOSE_OUTCOME: ${{ steps.close.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: python scripts/goalie_request_feedback.py
