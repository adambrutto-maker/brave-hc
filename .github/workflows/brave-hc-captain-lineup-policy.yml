name: Brave H.C. captain lineup rule integrity

on:
  pull_request:
    paths:
      - "scripts/brave_hc_captain_lineup_rules.json"
      - "scripts/verify_brave_hc_captain_lineup.py"
      - "widgets/assets/lineups/**"
      - "widgets/game-centre-lineup-public.json"
      - "widgets/game-centre-next.html"
      - "widgets/game-centre-arena-r32.html"
      - "widgets/game-centre-next.css"
      - "widgets/game-centre-next.js"
      - "widgets/game-centre-mobile-lineup.js"
      - "tests/test_game367_mobile_lineup.cjs"
      - "tests/test_game367_public_activation.cjs"
      - "tests/test_brave_hc_captain_lineup.py"
      - "tests/test_damien_pavaday_profile_lineup.py"
      - "tests/test_game366_captain_three_winger_pairs_r5.py"
      - "tests/test_game367_captain_nov22.py"
      - "widgets/player-links.js"
      - "tests/test_player_links.js"
      - "tests/test_lineup_inline_preview.cjs"
  push:
    branches: [main]
    paths:
      - "scripts/brave_hc_captain_lineup_rules.json"
      - "scripts/verify_brave_hc_captain_lineup.py"
      - "widgets/assets/lineups/**"
      - "widgets/game-centre-lineup-public.json"
      - "widgets/game-centre-next.html"
      - "widgets/game-centre-arena-r32.html"
      - "widgets/game-centre-next.css"
      - "widgets/game-centre-next.js"
      - "widgets/game-centre-mobile-lineup.js"
      - "tests/test_game367_mobile_lineup.cjs"
      - "tests/test_game367_public_activation.cjs"
      - "tests/test_brave_hc_captain_lineup.py"
      - "tests/test_damien_pavaday_profile_lineup.py"
      - "tests/test_game366_captain_three_winger_pairs_r5.py"
      - "tests/test_game367_captain_nov22.py"
      - "widgets/player-links.js"
      - "tests/test_player_links.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-captain-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every retained captain public lineup record
        run: python -B scripts/verify_brave_hc_captain_lineup.py
      - name: Negative tests - pair breaking, mismatched fonts, jersey 59 and visible status labels
        run: python -B -m unittest discover -s tests -p test_brave_hc_captain_lineup.py -v
      - name: Verify Damien Pavaday corrected HTO identity, jersey zero and backward-compatible player profile link
        run: python -B -m unittest discover -s tests -p test_damien_pavaday_profile_lineup.py -v
      - name: Enforce exact November 15 preferred winger pairs, fair line order and preserved historical cards
        run: python -B -m unittest discover -s tests -p test_game366_captain_three_winger_pairs_r5.py -v
      - name: Verify November 22 manager-confirmed 13-skater fixture, whole winger pairs and fifth D
        run: python -B -m unittest discover -s tests -p test_game367_captain_nov22.py -v
      - name: Verify stable native HTO player profile link and historical aliases
        run: node --test tests/test_player_links.js
      - name: Verify HTO public working card and source
        run: node --test tests/test_public_working_lineup.cjs tests/test_lineup_inline_preview.cjs tests/test_public_rental_goalie_confirmation.cjs tests/test_game367_public_activation.cjs tests/test_game367_mobile_lineup.cjs
