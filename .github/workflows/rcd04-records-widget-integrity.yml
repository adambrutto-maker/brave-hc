name: RCD04/RCD05 Records widget, historical archive and stat-family order integrity

on:
  pull_request:
    paths:
      - 'widgets/history-records.json'
      - 'widgets/player-record-book.json'
      - 'widgets/history-records-legacy-558.json'
      - 'widgets/watch-v2.html'
      - 'tests/history_companion_browser_qa.cjs'
      - 'tests/watch_historical_browser_qa.cjs'
      - 'tests/test_current_native_records_widget_460.py'
      - 'tests/test_rcd05_records_stat_family_order.py'
      - 'docs/261028_RCD05_Records_Stat_Family_Order_Spec.json'
      - 'scripts/sync_native_hto_records_family_order.py'
      - 'scripts/sync_463_hto_records_and_player_gtg.py'
      - 'widgets/history.js'
      - 'tests/test_record_dates_readable.cjs'
      - 'scripts/refresh_record_sources.py'
      - 'scripts/record_source_date_identity.py'
      - 'tests/test_record_source_refresh.py'
      - 'tests/test_historical_bulletin_milestones.py'
      - 'tests/test_watch_historical_evidence.js'
      - 'scripts/stage_current_hto_records_widget.py'
      - '.github/workflows/rcd04-records-widget-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Verify live 463-source port and original 558-source archived evidence
        run: |
          python -m unittest discover -s tests -p test_current_native_records_widget_460.py
          python -m unittest discover -s tests -p test_rcd05_records_stat_family_order.py
          node tests/test_record_dates_readable.cjs
          python -m unittest discover -s tests -p test_record_source_refresh.py
          python -m unittest discover -s tests -p test_historical_bulletin_milestones.py
          python -m unittest discover -s tests -p test_hockeyos_plan03_release_health.py
          node --test tests/test_watch_historical_evidence.js
  browser:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts "puppeteer-core@^24"
      - name: Verify 463 records and unchanged historical honours on desktop/mobile
        env:
          BRAVE_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          BRAVE_PUPPETEER_MODULE: puppeteer-core
        run: node tests/history_companion_browser_qa.cjs
      - name: Preserve historical Watch and milestone archive on desktop/mobile
        env:
          BRAVE_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/watch_historical_browser_qa.cjs
