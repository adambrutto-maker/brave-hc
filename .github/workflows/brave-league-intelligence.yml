name: Brave H.C. all-division league intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'widgets/league-intelligence.json'
      - 'widgets/league-intelligence.html'
      - 'widgets/league-intelligence.js'
      - 'widgets/league-scouting.js'
      - 'tests/test_svhl_league_scouting.cjs'
      - 'widgets/home-panels.html'
      - 'scripts/collect_svhl_league_intelligence.py'
      - 'scripts/build_svhl_league_intelligence_public.py'
      - 'scripts/check_svhl_league_intelligence.py'
      - 'scripts/model_svhl_schedule_strength.py'
      - 'scripts/track_svhl_strength_trends.py'
      - 'scripts/build_svhl_weekly_strength.py'
      - 'scripts/collect_svhl_historical_standings.py'
      - 'tests/test_svhl_historical_weekly.py'
      - 'widgets/historical-svhl-standings.json'
      - 'tests/test_svhl_strength_trends.py'
      - 'tests/test_svhl_schedule_adjusted_context.py'
      - 'tests/test_svhl_fixture_scouting.py'
      - 'scripts/publish_svhl_league_intelligence.py'
      - 'scripts/track_svhl_division_movements.py'
      - 'scripts/seed_cristillo_division_observation.py'
      - 'widgets/cristillo-membership-20261026-baseline.json'
      - 'tests/test_svhl_division_movement_history.py'
      - 'tests/test_svhl_league_intelligence_public.py'
      - 'tests/test_svhl_league_daily_publisher.py'
      - '.github/workflows/brave-league-intelligence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'widgets/league-intelligence.json'
      - 'widgets/league-intelligence.html'
      - 'widgets/league-intelligence.js'
      - 'widgets/league-scouting.js'
      - 'tests/test_svhl_league_scouting.cjs'
      - 'widgets/home-panels.html'
      - 'scripts/collect_svhl_league_intelligence.py'
      - 'scripts/build_svhl_league_intelligence_public.py'
      - 'scripts/check_svhl_league_intelligence.py'
      - 'scripts/model_svhl_schedule_strength.py'
      - 'scripts/track_svhl_strength_trends.py'
      - 'scripts/build_svhl_weekly_strength.py'
      - 'scripts/collect_svhl_historical_standings.py'
      - 'tests/test_svhl_historical_weekly.py'
      - 'widgets/historical-svhl-standings.json'
      - 'tests/test_svhl_strength_trends.py'
      - 'tests/test_svhl_schedule_adjusted_context.py'
      - 'tests/test_svhl_fixture_scouting.py'
      - 'scripts/publish_svhl_league_intelligence.py'
      - 'scripts/track_svhl_division_movements.py'
      - 'scripts/seed_cristillo_division_observation.py'
      - 'widgets/cristillo-membership-20261026-baseline.json'
      - 'tests/test_svhl_division_movement_history.py'
      - 'tests/test_svhl_league_intelligence_public.py'
      - 'tests/test_svhl_league_daily_publisher.py'
      - '.github/workflows/brave-league-intelligence.yml'
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

concurrency:
  group: league-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout accepted public source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck all-division source and game pairing
        run: python scripts/check_svhl_league_intelligence.py
      - name: Guard previous season and Brave H.C. history
        run: python -m unittest discover -s tests -p test_svhl_league_intelligence_public.py
      - name: Guard no-regression daily publication
        run: python -m unittest discover -s tests -p test_svhl_league_daily_publisher.py
      - name: Protect source-observed division movements and incoming scouting
        run: python -m unittest discover -s tests -p test_svhl_division_movement_history.py
      - name: Verify schedule-adjusted index mathematics and excluded head-to-head
        run: python -m unittest discover -s tests -p test_svhl_schedule_adjusted_context.py
      - name: Verify append-only trend history, source changes and no invented points
        run: python -m unittest discover -s tests -p test_svhl_strength_trends.py
      - name: Verify source-only scouting and WhatsApp briefs
        run: node tests/test_svhl_league_scouting.cjs
      - name: Guard source-proven upcoming scouting against the existing SVHL↔HTO feed
        run: python -m unittest discover -s tests -p test_svhl_fixture_scouting.py
      - name: Guard weekly ratings, history source identities and closed-week immutability
        run: python -m unittest discover -s tests -p test_svhl_historical_weekly.py
      - name: Detect stalled daily local collector
        if: github.event_name == 'schedule'
        run: python scripts/check_svhl_league_intelligence.py --fresh
