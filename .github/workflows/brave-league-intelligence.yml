permissions:
  contents: read

concurrency:
  group: league-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout accepted public source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck all-division source and game pairing
        run: python scripts/check_svhl_league_intelligence.py
      - name: Verify unified scouting coverage and source limitation report
        run: python -B scripts/report_hockeyos_scouting_coverage.py > /dev/null
      - name: Reject unsupported scouting coverage and invented history
        run: python -B -m unittest discover -s tests -p test_hockeyos_scouting_coverage_report.py
      - name: Guard previous season and Brave H.C. history
        run: python -m unittest discover -s tests -p test_svhl_league_intelligence_public.py
      - name: Guard no-regression daily publication
        run: python -m unittest discover -s tests -p test_svhl_league_daily_publisher.py
      - name: Protect source-observed division movements and incoming scouting
        run: python -m unittest discover -s tests -p test_svhl_division_movement_history.py
      - name: Verify schedule-adjusted index mathematics and excluded head-to-head
        run: python -m unittest discover -s tests -p test_svhl_schedule_adjusted_context.py
      - name: Verify append-only trend history, source changes and no invented points
        run: python -m unittest discover -s tests -p test_svhl_strength_trends.py
      - name: Verify source-bound opponent snapshots, adult-only team browser and division tradeoffs
        run: node tests/test_hockeyos_decision_cards.cjs
      - name: Prevent cross-team deep-link/selector/scouting snapshot mismatch
        run: node tests/test_hockeyos_deeplink_selection.cjs
      - name: Guard accessible default game-day WhatsApp and matchup copy controls
        run: node tests/test_hockeyos_quick_actions.cjs
      - name: Guard essentials/full-data scouting UX and progressive disclosure
        run: node tests/test_hockeyos_simple_view.cjs
      - name: Verify source-only scouting and WhatsApp briefs
        run: node tests/test_svhl_league_scouting.cjs
      - name: Guard source-proven upcoming scouting against the existing SVHL↔HTO feed
        run: python -m unittest discover -s tests -p test_svhl_fixture_scouting.py
      - name: Guard weekly ratings, history source identities and closed-week immutability
        run: python -m unittest discover -s tests -p test_svhl_historical_weekly.py
      - name: Independently verify historic Brave dual-source score/date joins
        run: python scripts/check_brave_historical_public.py
      - name: Verify explanatory league and historical division model
        run: node tests/test_svhl_historical_insights.cjs
      - name: Verify evidence-only division grouping and explicit no-release gate
        run: node tests/test_division_fit_model.cjs
      - name: Guard provisional video strength with strict read-only source and opponent bridge gates
        run: node tests/test_video_strength_evidence.cjs
      - name: Rebuild official GameInfo IDs for 54 adult games without new source writes
        run: node scripts/build_svhl_official_game_id_bridges.cjs --check
      - name: Reject mismatched official game IDs, score sides, duplicate games and held scorer promotion
        run: node tests/test_svhl_official_game_id_bridges.cjs
      - name: Rebuild 79 historical Brave GameInfo IDs with unchanged source hashes
        run: node scripts/build_brave_historical_gameinfo_id_bridges.cjs --check
      - name: Refuse forged historical opponent, period-goal admission and game ID linkage
        run: node tests/test_brave_historical_gameinfo_id_bridges.cjs
      - name: Guard adult Sunday scope and retrospective matchup evidence
        run: node tests/test_adult_division_evidence.cjs
      - name: Verify source-qualified weekly rating drift, adult band changes and missing week holds
        run: node tests/test_weekly_strength_stability.cjs
      - name: Verify even-team division layouts, all 22 IDs, evidence and consent holds
        run: node tests/test_division_layout_optimizer.cjs
      - name: Verify bounded evidence-aware lineup refinement and unmodified source history
        run: node tests/test_division_lineup_refinement.cjs
      - name: Independently verify public historical player ID and roster team source hashes
        run: python scripts/check_svhl_roster_intelligence.py
      - name: Verify current-roster same-player-ID historical scoring and era context
        run: node tests/test_roster_era_strength.cjs
      - name: Verify roster strength scouting, opponent identities and division context
        run: node tests/test_roster_strength_scouting.cjs
      - name: Guard supplemental roster construction across source-qualified division layouts
        run: node tests/test_roster_division_evidence.cjs
      - name: Check no-publication roster replay against a fresh isolated checkout
        run: |
          git clone -q . "$RUNNER_TEMP/roster-clean-qa"
          python -B "$RUNNER_TEMP/roster-clean-qa/scripts/publish_svhl_roster_intelligence.py" --repo "$RUNNER_TEMP/roster-clean-qa" --private "$RUNNER_TEMP" --receipt "$RUNNER_TEMP/roster-check-only.json" --check-only --candidate-only "$RUNNER_TEMP/roster-clean-qa/widgets/svhl-roster-intelligence.json"
          test -z "$(git -C "$RUNNER_TEMP/roster-clean-qa" status --porcelain)"
      - name: Fail closed on Git porcelain status and unauthorized roster publisher file changes
        run: python -B -m unittest discover -s tests -p test_roster_publisher_scope.py -v
      - name: Validate score-matched official game sheets and player-ID reconciliations
        run: python -B scripts/check_svhl_player_game_evidence.py
      - name: Refuse invented GameInfo scorers, assists, source URLs and appearances
        run: python -B -m unittest discover -s tests -p test_svhl_player_game_sources.py -v
      - name: Rebuild held GameInfo discrepancy triage without modifying league sources
        run: python -B scripts/build_svhl_scoring_source_holds_triage.py > /dev/null
      - name: Reject scoring-sheet undercount overcount confusion and source tampering
        run: python -B -m unittest discover -s tests -p test_svhl_scoring_source_holds_triage.py -v
      - name: Validate complete 137-game author-audited raw-GameInfo source review feed
        run: python -B -m unittest discover -s tests -p test_svhl_gameinfo_hold_review.py -v
      - name: Verify replayed source classification without any network or player score changes
        run: python -B -m unittest discover -s tests -p test_svhl_held_gameinfo_live.py -v
      - name: Guard source-owner roster review packets against unverified scorer identity and admission
        run: python -B -m unittest discover -s tests -p test_svhl_roster_source_owner_packet.py -v
      - name: Verify bounded 39-source-game scorer receipt merging without admitting goals
        run: python -B -m unittest discover -s tests -p test_svhl_roster_receipt_merge.py -v
      - name: Guard original 98 raw GameInfo discrepancies and no source-owner score promotions
        run: python -B -m unittest discover -s tests -p test_svhl_raw_gameinfo_disposition_packet.py -v
      - name: Separate historical held matchup same-day and duplicate date source evidence without score promotion
        run: python -B -m unittest discover -s tests -p test_historical_43_schedule_triage.py -v
      - name: Guard source-stamped weekly roster age without equating separate daily captures
        run: python -B -m unittest discover -s tests -p test_roster_source_time_boundary.py -v
      - name: Verify sampled official GameInfo penalty tables without fake PIM or GP
        run: python -B scripts/check_svhl_penalty_coverage.py
      - name: Validate distinct score-linked attendance lower bound and reject forged records
        run: node tests/test_player_participation_evidence.cjs
      - name: Detect stalled daily local collector
        if: github.event_name == 'schedule'
        run: python scripts/check_svhl_league_intelligence.py --fresh
