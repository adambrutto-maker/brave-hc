name: Brave H.C. goalie publish preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate goalie remote-state guard
        run: python -m unittest discover -s tests -p test_goalie_remote_pre_push.py
      - name: Test post-publish receipt against known fixture scenarios
        run: python -m unittest discover -s tests -p test_goalie_receipt.py
      - name: Verify latest real GitHub data without writes
        run: |
          git fetch origin main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          schedule=json.loads(Path("widgets/svhl-upcoming.json").read_text(encoding="utf-8"))
          saved=json.loads(Path("widgets/goalie-assignments.json").read_text(encoding="utf-8"))
          game=next((g for g in schedule["games"] if
                     saved["assignments"].get(g["assignmentKey"]) not in (None,"TBD")), None)
          if game is None:
              raise RuntimeError("No already-confirmed goalie game for no-write preflight")
          key=game["assignmentKey"]
          name=saved["assignments"][key]
          cmd=["python","scripts/verify_goalie_push.py","--game-key",key,
               "--fixture-signature",game["fixtureSignature"],
               "--expected-goalie",name,"--goalie",name]
          subprocess.run(cmd,check=True)
          receipt=["python","scripts/verify_goalie_receipt.py","--game-key",key,
                   "--fixture-signature",game["fixtureSignature"],
                   "--expected-goalie",name,"--goalie",name]
          subprocess.run(receipt,check=True)
          print("READ_ONLY_PASS: pre-push guard AND published goalie receipt match origin/main")
          PY
      - name: Confirm no tracked file modifications
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
