name: AW19 Source-Verified Milestone Club Rules

on:
  pull_request:
    paths:
      - 'scripts/aw19_verified_club_engine.py'
      - 'scripts/test_aw19_verified_club_engine.py'
      - 'scripts/aw19_latest_official_hto_candidates.py'
      - 'scripts/test_aw19_latest_official_hto_candidates.py'
      - 'scripts/aw19_stage_native_hto_awards_actions.py'
      - 'scripts/test_aw19_stage_native_hto_awards_actions.py'
      - 'widgets/player-highlights-v2.js'
      - 'scripts/test-aw19-profile-extended-clubs.cjs'
      - '.github/workflows/aw19-verified-clubs-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-club-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install HTO source parser dependencies
        run: python -m pip install "beautifulsoup4>=4.12,<5" "requests>=2.31,<3"
      - name: Verify official game events, thresholds and duplicate guards
        run: |
          python scripts/test_aw19_verified_club_engine.py
          python scripts/test_aw19_latest_official_hto_candidates.py
          python scripts/test_aw19_stage_native_hto_awards_actions.py
      - name: Validate future clubs in player profile Achievement Locker
        run: |
          node --check widgets/player-highlights-v2.js
          node scripts/test-aw19-profile-extended-clubs.cjs
