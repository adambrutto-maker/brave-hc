name: Brave H.C. public goalie widget browser QA
on:
  workflow_dispatch:
  schedule:
    - cron: '47 11 * * *'
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser smoke prerequisites
        shell: bash
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'playwright>=1.53,<2'
          google-chrome --version
      - name: Verify CSS text contrast rules and regression cases
        run: python -m unittest discover -s tests -p test_goalie_widget_contrast.py
      - name: Verify live goalie manager creates prefilled requests without submitting
        run: python tests/smoke_goalie_manager_live.py
      - name: Verify live HTO iframe and actual upcoming goalie rows
        run: python tests/smoke_goalie_widget_live.py
