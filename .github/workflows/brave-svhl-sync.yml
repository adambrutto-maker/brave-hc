name: Brave H.C. SVHL schedule reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/svhl_hto_reconcile.py'
      - 'scripts/game_day_readiness.py'
      - 'scripts/workflow_health_watch.py'
      - 'tests/test_workflow_health_watch.py'
      - '.github/workflows/brave-svhl-watchdog.yml'
      - 'tests/test_game_day_readiness.py'
      - 'scripts/svhl_issue_watch.py'
      - 'scripts/hto_review_packet.py'
      - 'tests/test_hto_review_packet.py'
      - 'scripts/process_goalie_issue.py'
      - 'scripts/goalie_request_feedback.py'
      - 'tests/test_goalie_request_feedback.py'
      - 'tests/test_goalie_issue.py'
      - '.github/workflows/brave-goalie-issue.yml'
      - '.github/workflows/brave-goalie-confirm.yml'
      - 'tests/test_svhl_hto_parser.py'
      - 'tests/test_svhl_snapshot_coverage.py'
      - 'tests/test_goalie_continuity.py'
      - 'tests/test_goalie_assignment.py'
      - 'tests/test_goalie_roster.py'
      - 'widgets/goalie-roster.json'
      - 'scripts/set_goalie.py'
      - 'widgets/goalie-schedule-v1.2-HTO-embed.html'
      - 'widgets/goalie-manager-v1.2.html'
      - '.github/workflows/brave-svhl-sync.yml'
  schedule:
    - cron: '17 */4 * * *'  # regular verification, UTC
    - cron: '19 * * * 0'   # hourly on Sundays UTC
    - cron: '19 0-6 * * 1' # Sunday evening/night in Toronto (crosses UTC midnight)
permissions:
  contents: write
  issues: write
concurrency:
  group: brave-svhl-sync
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate independent schedule failure watchdog
        run: python -m unittest discover -s tests -p test_workflow_health_watch.py
      - name: Validate next-game goalie readiness policies
        run: python -m unittest discover -s tests -p test_game_day_readiness.py
      - name: Validate source parser
        run: python tests/test_svhl_hto_parser.py
      - name: Validate manual HTO correction packets
        run: python -m unittest discover -s tests -p test_hto_review_packet.py
      - name: Validate verified HTO goalie roster and dropdown allowlist
        run: python -m unittest discover -s tests -p test_goalie_roster.py
      - name: Reject partial league snapshots and persist missing-game review
        run: python -m unittest discover -s tests -p test_svhl_snapshot_coverage.py
      - name: Validate goalie assignments through schedule changes
        run: python -m unittest discover -s tests -p test_goalie_continuity.py
      - name: Validate protected goalie confirmation logic
        run: python -m unittest discover -s tests -p test_goalie_assignment.py
      - name: Validate authenticated goalie issue approval
        run: python -m unittest discover -s tests -p test_goalie_issue.py
      - name: Validate failed goalie request reporting and safe retry instructions
        run: python -m unittest discover -s tests -p test_goalie_request_feedback.py
      - name: Validate public widget and manager JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for file in ('widgets/goalie-schedule-v1.2-HTO-embed.html', 'widgets/goalie-manager-v1.2.html'):
              html=Path(file).read_text()
              match=re.search(r'<script>(.*?)</script>',html,re.S)
              if not match:
                  raise RuntimeError('Missing JS in '+file)
              with tempfile.TemporaryDirectory() as folder:
                  path=Path(folder)/'check.js'
                  path.write_text(match.group(1))
                  subprocess.run(['node','--check',str(path)],check=True)
              print('PASS JS:',file)
          PY
      - name: Compare league and team schedules (no HTO writes)
        run: python scripts/svhl_hto_reconcile.py --out build/svhl-review
      - name: Store reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: svhl-hto-review
          path: |
            build/svhl-review/reconciliation.json
            build/svhl-review/hto-review.md
          retention-days: 14
      - name: Open or close one HTO review issue when league changes are detected
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/svhl_issue_watch.py build/svhl-review/reconciliation.json
      - name: Review next game readiness without contacting players or editing HTO
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/game_day_readiness.py --feed build/svhl-review/svhl-upcoming.json --assignments widgets/goalie-assignments.json
      - name: Publish league feed only if game details changed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          target=Path('widgets/svhl-upcoming.json')
          new=json.loads(Path('build/svhl-review/svhl-upcoming.json').read_text())
          old=json.loads(target.read_text()) if target.exists() else {}
          try:
              last=datetime.fromisoformat(old.get('checkedAt',''))
              if last.tzinfo is None: last=last.replace(tzinfo=timezone.utc)
              stale=(datetime.now(timezone.utc)-last).total_seconds()>4*3600
          except ValueError:
              stale=True
          if (new['games']!=old.get('games') or
              new.get('missingFixtureReviews',[])!=old.get('missingFixtureReviews',[]) or stale):
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(new,indent=2)+'\n')
              print('Verified SVHL changes or 4-hour freshness stamp staged')
          else:
              print('SVHL fixture data unchanged')
          PY
          if ! git diff --quiet -- widgets/svhl-upcoming.json || [ -n "$(git ls-files --others --exclude-standard -- widgets/svhl-upcoming.json)" ]; then
            git config user.name "BruTTech Schedule Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add widgets/svhl-upcoming.json
            git commit -m "Refresh verified SVHL schedule feed"
            git pull --rebase
            git push
          fi
