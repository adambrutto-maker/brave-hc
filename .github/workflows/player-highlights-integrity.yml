name: Player highlight award and milestone integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'widgets/player-highlights-v2.js'
      - 'widgets/player-highlights.html'
      - 'widgets/player-highlights-v2-preview.html'
      - 'widgets/player-highlights-ledger.json'
      - 'widgets/history-records.json'
      - 'widgets/player-record-book.json'
      - 'widgets/player-actuals-hourly.json'
      - 'scripts/refresh_verified_hto_player_actuals_hourly.py'
      - 'tests/test_hourly_hto_player_actuals.py'
      - 'tests/test_hourly_hto_player_visual_refresh_edge.py'
      - 'tests/test_earned_milestone_wall_edge.py'
      - 'tests/test_two_sided_achievement_locker_edge.py'
      - 'tests/test_four_view_achievement_locker_browser.py'
      - 'widgets/player-highlights-display-corrections.json'
      - 'widgets/assets/awards/**'
      - 'widgets/assets/clubs/**'
      - 'widgets/assets/round-clubs/**'
      - 'widgets/assets/full-crest-clubs/**'
      - 'scripts/build_fullcrest_milestones.py'
      - 'scripts/build_unified_milestone_art.py'
      - 'tests/test_unified_trophy_design_browser.py'
      - 'tests/composite_badge_expectations.py'
      - 'tests/test_composite_badges_and_diamond_finish_browser.py'
      - 'scripts/test_source_guarded_composite_badges.cjs'
      - 'scripts/test_record_set_tied_source_parity.cjs'
      - 'tests/test_web07_badge_center_tier_record_browser.py'
      - 'tests/test_fullcrest_milestone_art.py'
      - 'tests/test_fullcrest_badge_browser.py'
      - 'widgets/assets/approved/**'
      - 'widgets/assets/approved-sources/**'
      - 'widgets/assets/approved-history/**'
      - 'scripts/install-approved-discipline-whistle.py'
      - 'tests/test_discipline_whistle_replacement.py'
      - 'widgets/assets/opaque-originals/**'
      - 'scripts/build-transparent-badge-art.py'
      - 'tests/test_transparent_badge_background.py'
      - 'widgets/assets/special/**'
      - 'widgets/assets/heritage/**'
      - 'scripts/build-player-heritage-art.py'
      - 'scripts/verify-approved-artwork.py'
      - 'scripts/install-approved-artwork.py'
      - 'scripts/install-verified-round-clubs.py'
      - 'scripts/brave_hc_light_icons.py'
      - 'tests/test_patch_rolaids_and_tiers_edge.py'
      - 'tests/test_player_icon_dimensions_portable.py'
      - 'tests/test_hourly_verified_current_feed_edge.py'
      - 'tests/test_published_hto_current_actuals_edge.py'
      - 'scripts/test-player-highlights-v2.cjs'
      - 'scripts/test-aw19-published-historical-club-badges.cjs'
      - 'scripts/build-player-award-art.py'
      - 'scripts/build-club-milestone-art.py'
      - 'scripts/build-player-special-art.py'
      - '.github/workflows/player-highlights-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highlights-integrity:
    name: Verify source-preserving artwork and highlights
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser source syntax
        run: node --check widgets/player-highlights-v2.js
      - name: Test independent public HTO score and skater parity
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m unittest discover -s tests -p test_hourly_hto_player_actuals.py
      - name: Verify all 109 player identities, historic records, images and labels
        run: node scripts/test-player-highlights-v2.cjs
      - name: Verify 230 source-mapped HTO marks identify Record Set or Record Tied without rank inference
        run: node scripts/test_record_set_tied_source_parity.cjs
      - name: Verify three original multiline historical HTO records expand to exact independent display-only badges
        run: node scripts/test_source_guarded_composite_badges.cjs
      - name: Verify all 37 newly dated historical Goal Assist Shutout badges with official game source receipts
        run: node scripts/test-aw19-published-historical-club-badges.cjs
      - name: Install image manifest validation dependency
        run: python -m pip install 'pillow==11.3.0'
      - name: Validate authentic round milestone art and optional approved shield art
        run: python scripts/verify-approved-artwork.py --require-approved
      - name: Verify all 29 unified full-crest milestone medals and intact original 22-source archive
        run: python -m unittest discover -s tests -p test_fullcrest_milestone_art.py
      - name: Verify transparent approved and milestone emblems against opaque originals
        run: python -m unittest discover -s tests -p test_transparent_badge_background.py
      - name: Verify locked discipline whistle and red-card artwork, provenance and three published suspensions
        run: python -m unittest discover -s tests -p test_discipline_whistle_replacement.py
      - name: Recreate branded SVG icons deterministically
        run: python scripts/build-club-milestone-art.py
      - name: Confirm committed branded icons and SHA manifest match generator
        run: git diff --exit-code -- widgets/assets/clubs/
      - name: Recreate sourced championship and All-Star artwork
        run: python scripts/build-player-special-art.py
      - name: Confirm special icons and provenance manifest are reproducible
        run: git diff --exit-code -- widgets/assets/special/
      - name: Recreate complete historic award and leadership emblems
        run: python scripts/build-player-heritage-art.py
      - name: Confirm six final heritage images are reproducible
        run: git diff --exit-code -- widgets/assets/heritage/
      - name: Install browser for real responsive layout checks
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install browser test dependency
        run: python -m pip install 'selenium==4.50.0'
      - name: Verify 43 profiles at actual 355px and 810px browser widths
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_player_icon_dimensions_portable.py
      - name: Verify verified earned milestone wall layout and filters across all players
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_earned_milestone_wall_edge.py
      - name: Verify four in-place collection views across 43 profiles and discipline separation
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_two_sided_achievement_locker_edge.py
      - name: Verify in-place tabs at 320px, mobile and desktop including direct records and pagination
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_four_view_achievement_locker_browser.py
      - name: Verify full-crest goal assist shutout badge art, colored cards and synthetic future platinum
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_fullcrest_badge_browser.py
      - name: Verify gold award backgrounds, all-metal milestone cards, centered uniform typography and neutral discipline
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_unified_trophy_design_browser.py
      - name: Verify Alex James Norris and assistant captain separation, other composites and diamond platinum finish
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_composite_badges_and_diamond_finish_browser.py
      - name: Verify centred BRAVE/H.C. medals, All tier pill parity and gold/silver Set/Tied record statuses
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_web07_badge_center_tier_record_browser.py
      - name: Verify hourly current-season refresh and reject unverified changes
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_hourly_verified_current_feed_edge.py
      - name: Verify newer official HTO scoring and reject inconsistent feeds
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_published_hto_current_actuals_edge.py
      - name: Verify source-qualified hourly HTO updates and no inferred awards
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_hourly_hto_player_visual_refresh_edge.py
