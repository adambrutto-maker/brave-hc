name: Player highlight award and milestone integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'widgets/player-highlights-v2.js'
      - 'widgets/player-highlights.html'
      - 'widgets/player-highlights-v2-preview.html'
      - 'widgets/player-highlights-ledger.json'
      - 'widgets/player-highlights-display-corrections.json'
      - 'widgets/assets/awards/**'
      - 'widgets/assets/clubs/**'
      - 'widgets/assets/round-clubs/**'
      - 'widgets/assets/approved/**'
      - 'widgets/assets/special/**'
      - 'widgets/assets/heritage/**'
      - 'scripts/build-player-heritage-art.py'
      - 'scripts/verify-approved-artwork.py'
      - 'scripts/install-approved-artwork.py'
      - 'scripts/install-verified-round-clubs.py'
      - 'scripts/brave_hc_light_icons.py'
      - 'tests/test_patch_rolaids_and_tiers_edge.py'
      - 'tests/test_player_icon_dimensions_portable.py'
      - 'tests/test_hourly_verified_current_feed_edge.py'
      - 'scripts/test-player-highlights-v2.cjs'
      - 'scripts/build-player-award-art.py'
      - 'scripts/build-club-milestone-art.py'
      - 'scripts/build-player-special-art.py'
      - '.github/workflows/player-highlights-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highlights-integrity:
    name: Verify source-preserving artwork and highlights
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser source syntax
        run: node --check widgets/player-highlights-v2.js
      - name: Verify all 109 player identities, historic records, images and labels
        run: node scripts/test-player-highlights-v2.cjs
      - name: Install image manifest validation dependency
        run: python -m pip install 'pillow==11.3.0'
      - name: Validate authentic round milestone art and optional approved shield art
        run: python scripts/verify-approved-artwork.py
      - name: Recreate branded SVG icons deterministically
        run: python scripts/build-club-milestone-art.py
      - name: Confirm committed branded icons and SHA manifest match generator
        run: git diff --exit-code -- widgets/assets/clubs/
      - name: Recreate sourced championship and All-Star artwork
        run: python scripts/build-player-special-art.py
      - name: Confirm special icons and provenance manifest are reproducible
        run: git diff --exit-code -- widgets/assets/special/
      - name: Recreate complete historic award and leadership emblems
        run: python scripts/build-player-heritage-art.py
      - name: Confirm six final heritage images are reproducible
        run: git diff --exit-code -- widgets/assets/heritage/
      - name: Install browser for real responsive layout checks
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install browser test dependency
        run: python -m pip install 'selenium==4.50.0'
      - name: Verify 43 profiles at actual 355px and 810px browser widths
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_player_icon_dimensions_portable.py
      - name: Verify hourly current-season refresh and reject unverified changes
        env:
          BRAVE_QA_BROWSER: chrome
        run: python tests/test_hourly_verified_current_feed_edge.py
