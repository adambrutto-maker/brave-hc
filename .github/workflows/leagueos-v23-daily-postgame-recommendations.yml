name: LeagueOS V24 daily fixture discovery and postgame division recommendations

on:
  workflow_dispatch:
  schedule:
    # Two idempotent Toronto-morning checks per day to cover daylight savings.
    - cron: '35 13,14 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: leagueos-v24-source-qualified-postgame-refresh
  cancel-in-progress: false

jobs:
  verified-postgame-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install independent public source reading dependencies
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'

      - name: Check source parsers and daily settlement safeguards
        run: |
          python -m py_compile \
            scripts/collect_svhl_league_intelligence.py \
            scripts/collect_svhl_player_game_events.py \
            scripts/discover_leagueos_fixtures_v24.py \
            scripts/collect_leagueos_settled_delta_v23.py \
            scripts/capture_svhl_crossnight_player_bridge_v23.py
          node --check scripts/build_leagueos_division_recommendations_v23.cjs
          node --check widgets/leagueos-division-plan-v23.js
          node --check widgets/leagueos-source-coverage-v24.js
          node --check scripts/build_leagueos_player_team_forecasts_v25.cjs
          node --check scripts/build_leagueos_division_lifecycle_v25.cjs
          node --check widgets/leagueos-competition-studio-v25.js
          python tests/test_leagueos_daily_settlement_v23.py
          python tests/test_leagueos_fixture_discovery_v24.py

      - name: Discover exact public game IDs across all four nights
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v24-source
          python scripts/discover_leagueos_fixtures_v24.py --workers 6 | tee build/v24-source/discovery.json
          if test -n "$(git status --porcelain -- widgets/leagueos-fixture-discovery-v24.json)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new reciprocal fixture change. Do not republish timestamps."
          fi

      - name: Capture exact-ID reciprocal finals only AFTER Toronto game date
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_leagueos_settled_delta_v23.py --max-workers 4 | tee build/v24-source/settlement.json
          if test -n "$(git status --porcelain -- widgets/leagueos-settled-delta-v23.json)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No verified newly settled games; existing numeric recommendations retained."
          fi

      - name: Recapture exact current player IDs and cross-night production
        if: steps.source.outputs.changed == 'true'
        run: |
          python scripts/capture_svhl_crossnight_player_bridge_v23.py --workers 5 \
            --output widgets/leagueos-cross-night-player-bridge-v23.json

      - name: Update numerical four-night recommendations ONLY after verified finals
        if: steps.source.outputs.changed == 'true'
        run: node scripts/build_leagueos_division_recommendations_v23.cjs

      - name: Rebuild league-scale player and team forecasts ONLY after verified finals
        if: steps.source.outputs.changed == 'true'
        run: node scripts/build_leagueos_player_team_forecasts_v25.cjs

      - name: Refresh unslotted candidate schedule impacts on source fixture or result changes
        if: steps.source.outputs.changed == 'true' || steps.fixture.outputs.changed == 'true'
        run: node scripts/build_leagueos_division_lifecycle_v25.cjs

      - name: Fail closed unless all source and model protections pass
        if: steps.source.outputs.changed == 'true' || steps.fixture.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_leagueos_fixture_discovery_v24.py
          python tests/test_leagueos_daily_settlement_v23.py
          node --test \
            tests/test_leagueos_source_coverage_v24.cjs \
            tests/test_leagueos_division_recommendations_v23.cjs \
            tests/test_leagueos_reconciliation_v22.cjs \
            tests/test_hockeyos_public_games_v21.cjs \
            tests/test_hockeyos_native_roster_stats_v20.cjs \
            tests/test_player_performance_normalization.cjs \
            tests/test_leagueos_team_bridge_v18.cjs \
            tests/test_leagueos_dynamic_refresh_v25.cjs
          git diff --check

      - name: Publish only qualified JSON updates and redeploy the existing live demo
        if: steps.source.outputs.changed == 'true' || steps.fixture.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            widgets/leagueos-fixture-discovery-v24.json \
            widgets/leagueos-settled-delta-v23.json \
            widgets/leagueos-cross-night-player-bridge-v23.json \
            widgets/leagueos-division-recommendations-v23.json \
            widgets/leagueos-roster-player-projections-v25.json \
            widgets/leagueos-division-lifecycle-v25.json
          if git diff --cached --quiet; then
            echo "No new qualifying data; previous live model retained."
            exit 0
          fi
          git diff --cached --check
          git commit -m "data(LeagueOS): verified fixture discovery and settled results"
          # Avoid overwriting competing human changes; revalidate after rebase.
          git fetch origin main
          git rebase origin/main
          python tests/test_leagueos_fixture_discovery_v24.py
          node --test \
            tests/test_leagueos_source_coverage_v24.cjs \
            tests/test_leagueos_division_recommendations_v23.cjs \
            tests/test_leagueos_dynamic_refresh_v25.cjs
          git diff --check
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not trigger push-based Pages builds.
          gh workflow run pages.yml --ref main

      - name: Retain bounded evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leagueos-v24-fixture-and-settlement-review
          path: |
            build/v24-source/discovery.json
            build/v24-source/settlement.json
          if-no-files-found: warn
          retention-days: 14
