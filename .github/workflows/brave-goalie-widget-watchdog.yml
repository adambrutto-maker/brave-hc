name: Brave H.C. public goalie widget QA watchdog
on:
  workflow_run:
    workflows:
      - Brave H.C. public goalie widget browser QA
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 2,14 * * *'
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: brave-hc-widget-qa-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify browser QA failure, recovery and stale-run decisions
        run: python -m unittest discover -s tests -p test_widget_smoke_health.py
      - name: Independently inspect public website QA result and review issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/widget_smoke_health.py
