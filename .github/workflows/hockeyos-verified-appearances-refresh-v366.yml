name: HockeyOS verified individual appearances refresh
on:
  push:
    branches: [main]
    paths:
      - 'docs/hto-highlights-rollout/game-audit-evidence/live_boxscores.json'
      - 'docs/hto-highlights-rollout/261020_Historical_Boxscore_Index.json'
      - 'widgets/player-actuals-hourly.json'
      - 'widgets/player-career-insights.json'
      - 'scripts/build_hto_verified_player_appearances_v366.py'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hockeyos-complete-appearance-source-refresh
  cancel-in-progress: false

jobs:
  qualified-current-appearance-reconciliation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch approved current source snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and rebuild only the derived appearance feed
        run: |
          python scripts/build_hto_verified_player_appearances_v366.py --write
          python scripts/build_hto_verified_player_appearances_v366.py --check
          python -m unittest tests.test_hto_verified_player_appearances_v366 -q
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify recent form and model integrity
        run: |
          node --test tests/test_bio_form_v364.cjs
          node --test tests/test_hockeyos_dispersion_v365.cjs
      - name: Commit only qualified current-season appearance source
        run: |
          git config user.name 'HockeyOS Verified Appearance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- widgets/player-form-appearances-v364.json
          if git diff --cached --quiet; then
            echo 'No new reconciled game appearances; retaining approved source snapshot.'
            exit 0
          fi
          git commit -m 'chore(hockeyos): publish fully reconciled individual game appearances'
          git push origin HEAD:main
