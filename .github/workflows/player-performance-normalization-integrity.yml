name: HockeyOS standalone Bio V3.1 source and visual contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/261028_HockeyOS_Bio_Normalization_Product_Contract.md'
      - 'widgets/league-game-formats.json'
      - 'widgets/player-performance-normalization.js'
      - 'tests/test_player_performance_normalization.cjs'
      - 'widgets/player-bio.html'
      - 'widgets/player-bio-premium.js'
      - 'widgets/player-bio-current-v31.js'
      - 'widgets/player-bio-expanded-analytics-v31.js'
      - 'widgets/player-bio-alltime-share-v33.js'
      - 'widgets/player-bio-alltime-share-v33.css'
      - 'widgets/player-bio-attendance-rank-v31.js'
      - 'widgets/player-bio-attendance-verified-v31.json'
      - 'widgets/player-bio-rink-tactics-v31.js'
      - 'widgets/player-bio-rink-tactics-v31.css'
      - 'widgets/player-bio-season-outlook-v31.css'
      - 'widgets/player-bio-coaching-library-v31.json'
      - 'widgets/player-bio-coaching-library-v31.js'
      - 'widgets/player-bio-coaching-library-v31.css'
      - 'tests/test_bio_v31_clean_109_browser.cjs'
      - 'tests/test_bio_v31_clean_three_tab_browser.cjs'
      - 'tests/test_bio_v31_clean_negative_browser.cjs'
      - 'tests/test_bio_v31_clean_attendance_rank.cjs'
      - 'tests/test_bio_v31_clean_coaching_browser.cjs'
      - 'tests/test_bio_v32_percent_and_cohort_browser.cjs'
      - 'tests/test_bio_v33_historical_shares.cjs'
      - 'tests/test_bio_v33_content_browser.cjs'
      - 'tests/test_bio_v34_temperature_browser.cjs'
      - 'tests/test_bio_v36_angular_animation_browser.cjs'
      - 'tests/test_bio_v36_source_angle.cjs'
      - 'widgets/player-bio-trend-visual-v36.js'
      - 'widgets/player-bio-trend-visual-v36.css'
      - 'widgets/player-bio-v361-layout.css'
      - 'widgets/player-bio-v362-panel.css'
      - 'docs/261029_Bio_V33_Five_Pass_All_Time_Content_Audit.md'
      - 'widgets/player-bio-coaching-roles.js'
      - 'widgets/player-bio-positive-streaks.js'
      - 'tests/test_player_bio_v27_browser.cjs'
      - 'tests/test_player_bio_coaching_roles.cjs'
      - 'tests/test_player_bio_positive_streaks.cjs'
      - 'widgets/player-bio-premium.css'
      - 'widgets/player-bio-collection.css'
      - 'widgets/player-bio-advanced.js'
      - 'widgets/player-bio-projection-trend.js'
      - 'widgets/player-bio-rolling-career.js'
      - 'tests/test_player_bio_rolling_career.cjs'
      - 'docs/261028_HockeyOS_Video_Highlights_Coaching_Placement.md'
      - 'widgets/player-bio-season-titles.json'
      - 'widgets/player-highlights-ledger.json'
      - 'widgets/history-awards.json'
      - 'widgets/player-career-insights.json'
      - 'scripts/bio-season-titles-lib.cjs'
      - 'scripts/build_bio_season_titles.cjs'
      - 'tests/test_player_bio_season_titles.cjs'
      - 'tests/test_player_bio_projection_trend.cjs'
      - 'tests/test_player_bio_awards_trend_browser.cjs'
      - 'tests/test_player_bio_advanced.cjs'
      - 'tests/test_player_bio_collection_browser.cjs'
      - 'docs/261028_Player_Bio_Milestone_Parity_Analytics_V2.md'
      - 'widgets/goalie-projection-model.js'
      - 'tests/test_goalie_projection_model.cjs'
      - 'tests/test_player_bio_premium_browser.cjs'
      - 'tests/test_player_bio_browser.cjs'
      - 'docs/261028_Bio_Historical_Duration_Mapping_Evidence.md'
      - '.github/workflows/player-performance-normalization-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-normalization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check pure normalization module syntax
        run: node --check widgets/player-performance-normalization.js
      - name: Check source-preserving regression syntax
        run: node --check tests/test_player_performance_normalization.cjs
      - name: Check both conversion directions and 18 verified historical season bindings
        run: node --test tests/test_player_performance_normalization.cjs
      - name: Check new goalie projection safety and increasing current-season weighting
        run: node --test tests/test_goalie_projection_model.cjs
      - name: Check premium Bio JavaScript and goalie forecast module syntax
        run: |
          node --check widgets/player-bio-premium.js
          node --check widgets/player-bio-current-v31.js
          node --check widgets/player-bio-expanded-analytics-v31.js
          node --check widgets/player-bio-alltime-share-v33.js
          node --check widgets/player-bio-attendance-rank-v31.js
          node --check widgets/player-bio-rink-tactics-v31.js
          node --check widgets/player-bio-coaching-library-v31.js
          node --check widgets/player-bio-coaching-roles.js
          node --check widgets/player-bio-positive-streaks.js
          node --check widgets/player-bio-advanced.js
          node --check widgets/player-bio-projection-trend.js
          node --check widgets/player-bio-rolling-career.js
          node --check scripts/build_bio_season_titles.cjs
          node --check widgets/player-bio.js
          node --check widgets/goalie-projection-model.js
      - name: Require Milestone-parity Bio collection and new advanced data slots
        run: node -e "const fs=require('fs');const s=fs.readFileSync('widgets/player-bio.html','utf8');for(const q of ['id=\"bioStudio\"','id=\"bioAdvancedSection\"','id=\"bioDevelopmentSection\"','id=\"bioScoringMix\"','player-bio-advanced.js','player-bio-collection.css'])if(!s.includes(q)){console.error('missing '+q);process.exit(2)}"
      - name: Verify premium markup and required source integrity controls
        run: node -e "const fs=require('fs');const h=fs.readFileSync('widgets/player-bio.html','utf8');for(const x of ['id=\"bioTabs\"','id=\"bioComboChart\"','id=\"bioProjectionSection\"','id=\"bioGoalieSection\"','id=\"bioOpponentSection\"','player-bio-premium.js'])if(!h.includes(x))process.exit(2)"

      - name: Reject Game Night modules and private assignments from Bio-only release
        run: |
          node -e "const fs=require('fs');const blocked=['widgets/game-night-lineup-contract.js','widgets/game-night-lineup-public.json','widgets/game-night-approved-render.json'];const h=fs.readFileSync('widgets/player-bio.html','utf8');if(blocked.some(x=>fs.existsSync(x))||h.includes('game-night-lineup-contract.js')){console.error('Game Night release contamination');process.exit(2)}"
      - name: Verify official FT/CU/DI attendance formula and qualified player rankings
        run: node --test tests/test_bio_v31_clean_attendance_rank.cjs
      - name: Verify public attendance data stays held until separately authorized
        run: node -e "const d=require('./widgets/player-bio-attendance-verified-v31.json');if(d.status!=='HELD_PENDING_DERIVED_DATA_PUBLICATION_APPROVAL'||Object.keys(d.players||{}).length>0){process.exit(2)}"
      - name: Verify published all-time Braves career contributions across 109 historical HTO profiles
        run: node --test tests/test_bio_v33_historical_shares.cjs
      - name: Verify advanced stats calculations and fail-closed source coverage
        run: node --test tests/test_player_bio_advanced.cjs
      - name: Verify scoring titles are generated only from current public HTO awards sources
        run: node scripts/build_bio_season_titles.cjs --check
      - name: Verify source-based directional arrows, ROOKIE presentation, and scoring titles
        run: node --test tests/test_player_bio_projection_trend.cjs tests/test_player_bio_season_titles.cjs
      - name: Verify rolling career baseline uses past-only source-valid games on selected time basis
        run: node --test tests/test_player_bio_rolling_career.cjs
      - name: Verify position-only coaching and source-held personal streaks
        run: node --test tests/test_player_bio_coaching_roles.cjs tests/test_player_bio_positive_streaks.cjs
      - name: Install isolated Playwright test dependency
        run: npm install --no-package-lock --no-save playwright
      - name: Install browser for source-independent CI acceptance
        run: npx playwright install --with-deps chromium
      - name: Test approved three-panel V3.1 Outlook, Trends and Coaching UI at 320–1280px
        run: node tests/test_bio_v31_clean_three_tab_browser.cjs
      - name: Test missing/tampered source feeds fail closed in Season Outlook
        run: node tests/test_bio_v31_clean_negative_browser.cjs
      - name: Test public video sources, interactive rink board and advanced ranking chips
        run: node tests/test_bio_v31_clean_coaching_browser.cjs
      - name: Verify percent-of-GP legacy and advanced rates and 10-GP qualifying ranks
        run: node tests/test_bio_v32_percent_and_cohort_browser.cjs
      - name: Verify deduplicated V3.3 all-time shares and source holds on 16 mobile/desktop cases
        run: node tests/test_bio_v33_content_browser.cjs
      # Historical V3.4 visual tests are superseded by V3.6 center, angle, motion and source checks.
      - name: Validate V3.6 original source sigma, personalized bearings and missing-data holds
        run: node --test tests/test_bio_v36_source_angle.cjs
      - name: Verify V3.6.2 condition-matched panel, arrow, layout and reduced motion
        run: node tests/test_bio_v36_angular_animation_browser.cjs
      - name: Test all 109 verified HTO identities across three tabs at narrow embed width
        run: node tests/test_bio_v31_clean_109_browser.cjs
      - name: Test visual Bio V3.1 (chart labels, whole-GP forecast, role explorer)
        run: node tests/test_player_bio_v27_browser.cjs
      - name: Test polished player Bio across 109 HTO profiles and responsive viewports
        run: node tests/test_player_bio_premium_browser.cjs
      - name: Test Milestone-style collection, deep analytics, role switching and four mobile/desktop layouts
        run: node tests/test_player_bio_collection_browser.cjs
      - name: Test scoring-title chart markers and native workbook trend arrows in the Bio
        run: node tests/test_player_bio_awards_trend_browser.cjs
      - name: Run historical Bio identity, leadership and fallback regression with production CSS
        run: node tests/test_player_bio_browser.cjs
