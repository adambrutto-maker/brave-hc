# Refresh public evidence; native HTO publication remains a separate reviewed action.
name: Brave H.C. record source refresh
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Brave H.C. SVHL schedule reconciliation']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_record_sources.py'
      - 'tests/test_record_source_refresh.py'
      - 'scripts/reconcile_hto_milestone_review.py'
      - 'tests/test_hto_milestone_review.py'
      - 'scripts/audit_next_game_hto_admission.py'
      - 'tests/test_next_game_hto_admission.py'
      - 'scripts/audit_hockeyos_plan03_release_health.py'
      - 'tests/test_hockeyos_plan03_release_health.py'
      - 'scripts/plan03_review_workbook_period_reconciliation.py'
      - 'tests/test_plan03_workbook_shadow_periods.py'
      - 'scripts/audit_plan03_excel_disposable_recalc.py'
      - 'tests/test_plan03_excel_disposable_recalc.py'
      - 'scripts/audit_plan03_player_game_log_coverage.py'
      - 'tests/test_plan03_player_game_log_coverage.py'
      - 'scripts/audit_plan03_full_schema_game_log_staging.py'
      - 'tests/test_plan03_full_schema_game_log_staging.py'
      - 'scripts/audit_plan03_explicit_gtg_source.py'
      - 'tests/test_plan03_explicit_gtg_source.py'
      - 'scripts/audit_plan03_hto_season_pivot_parity.py'
      - 'tests/test_plan03_hto_season_pivot_parity.py'
      - 'scripts/audit_plan03_formula_error_recovery.py'
      - 'tests/test_plan03_formula_error_recovery.py'
      - 'widgets/watch-evidence.js'
      - 'widgets/watch-v2.html'
      - 'widgets/home-panels.html'
      - 'tests/test_watch_historical_evidence.js'
      - 'tests/watch_historical_browser_qa.cjs'
      - 'tests/fixtures/record-refresh-*.html'
      - '.github/workflows/brave-record-source-refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brave-record-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate source parsing and preservation rules
        run: python -m unittest discover -s tests -p test_record_source_refresh.py
      - name: Validate private milestone-to-record review contract (no publication)
        run: python -m unittest discover -s tests -p test_hto_milestone_review.py
      - name: Validate next-game pre-admission protections (not a completed result)
        run: python -m unittest discover -s tests -p test_next_game_hto_admission.py
      - name: Verify HTO historical Watch source-matching rules (no publication)
        run: node --test tests/test_watch_historical_evidence.js
      - name: Check Plan 03 task-success versus publication-hold contract (offline)
        run: python -m unittest discover -s tests -p test_hockeyos_plan03_release_health.py
      - name: Validate HTO period-to-workbook shadow review gate (no Excel writes)
        run: python -m unittest discover -s tests -p test_plan03_workbook_shadow_periods.py
      - name: Validate private-copy Excel source/formula preservation contract (offline)
        run: python -m unittest discover -s tests -p test_plan03_excel_disposable_recalc.py
      - name: Protect Player Game Log source-gap and no-publication contract (offline)
        run: python -m unittest discover -s tests -p test_plan03_player_game_log_coverage.py
      - name: Validate full-schema game-log unknowns and source-row collision holds (offline)
        run: python -m unittest discover -s tests -p test_plan03_full_schema_game_log_staging.py
      - name: Verify explicit HTO game-tying goals without inferring absent values (offline)
        run: python -m unittest discover -s tests -p test_plan03_explicit_gtg_source.py
      - name: Protect official HTO source-to-pivot parity and unknown-field release gates (offline)
        run: python -m unittest discover -s tests -p test_plan03_hto_season_pivot_parity.py
      - name: Validate Y4674 whitespace formula error recovery contract (offline)
        run: python -m unittest discover -s tests -p test_plan03_formula_error_recovery.py
      - name: Read public HTO results and published records
        run: python scripts/refresh_record_sources.py
      - name: Recalculate complete-ledger record candidates
        run: python scripts/build_automatic_record_candidates.py
      - name: Verify all player profile displays
        run: node scripts/test-player-highlights-v2.cjs
      - name: Store refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-source-refresh-${{ github.run_id }}
          path: |
            build/record-refresh/
            docs/hto-highlights-rollout/261020_Automatic_Record_Candidates.json
            docs/hto-highlights-rollout/261020_Automatic_Record_Candidates.md
          retention-days: 30
      - name: Commit verified sources and published record feeds
        id: commit
        shell: bash
        run: |
          git add docs/hto-highlights-rollout/261020_Historical_Boxscore_Index.json docs/hto-highlights-rollout/game-audit-evidence/live_boxscores.json docs/hto-highlights-rollout/261020_Automatic_Record_Candidates.json docs/hto-highlights-rollout/261020_Automatic_Record_Candidates.md widgets/history-records.json widgets/player-record-book.json
          if ! git diff --cached --quiet; then
            git config user.name 'BruTTech Record Refresh'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified HTO record sources and profile feeds'
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
