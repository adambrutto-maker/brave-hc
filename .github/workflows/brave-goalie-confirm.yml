name: Confirm Brave H.C. Goaltender
on:
  workflow_dispatch:
    inputs:
      game_key:
        description: 'HTO game key from the Goalie Manager (example: hto:3375682)'
        required: true
        type: string
      goalie:
        description: 'Confirmed goaltender'
        required: true
        type: choice
        options:
          - Dev Leong
          - Stephen Logue
          - TBD
          - Adam Carlyle
          - Matt Svec
          - Steve Noyek
          - Other / rental
      custom_goalie_name:
        description: 'Only for Other / rental (leave blank otherwise)'
        required: false
        type: string
      fixture_signature:
        description: 'Required to SAVE: exact SVHL fixture signature from verified published feed'
        required: false
        type: string
      expected_goalie:
        description: 'Required to SAVE: goalie currently recorded in the published assignments'
        required: false
        type: string
      dry_run:
        description: 'Test selection without saving'
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: brave-hc-goalie-request
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate goalie assignment rules
        run: python -m unittest discover -s tests -p test_goalie_assignment.py
      - name: Validate published goalie receipt before any success claim
        run: python -m unittest discover -s tests -p test_goalie_receipt.py
      - name: Validate latest remote goalie publication guard
        run: python -m unittest discover -s tests -p test_goalie_remote_pre_push.py
      - name: Apply manager-confirmed goalie
        env:
          GAME_KEY: ${{ inputs.game_key }}
          GOALIE: ${{ inputs.goalie }}
          CUSTOM_GOALIE_NAME: ${{ inputs.custom_goalie_name }}
          MANAGER: ${{ github.actor }}
          DRY_RUN: ${{ inputs.dry_run }}
          FIXTURE_SIGNATURE: ${{ inputs.fixture_signature }}
          EXPECTED_GOALIE: ${{ inputs.expected_goalie }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          cmd=['python','scripts/set_goalie.py','--game-key',os.environ['GAME_KEY'],
               '--goalie',os.environ['GOALIE'],'--custom-name',os.environ.get('CUSTOM_GOALIE_NAME',''),
               '--actor',os.environ['MANAGER'],
               '--fixture-signature',os.environ.get('FIXTURE_SIGNATURE',''),
               '--expected-goalie',os.environ.get('EXPECTED_GOALIE','')]
          if os.environ.get('DRY_RUN','true')=='true':
              cmd.append('--dry-run')
          else:
              cmd.extend(['--result-file','build/manual-goalie-request-status.json'])
          subprocess.run(cmd,check=True)
          PY
      - name: Commit only after explicitly disabling dry-run
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GAME_KEY: ${{ inputs.game_key }}
          GOALIE: ${{ inputs.goalie }}
          CUSTOM_NAME: ${{ inputs.custom_goalie_name }}
          FIXTURE_SIGNATURE: ${{ inputs.fixture_signature }}
          EXPECTED_GOALIE: ${{ inputs.expected_goalie }}
        run: |
          git fetch origin main
          python scripts/verify_goalie_push.py --game-key "$GAME_KEY" \
            --goalie "$GOALIE" --custom-name "$CUSTOM_NAME" \
            --fixture-signature "$FIXTURE_SIGNATURE" --expected-goalie "$EXPECTED_GOALIE"
          if git diff --quiet -- widgets/goalie-assignments.json; then
            echo "No goalie changes to commit"
            exit 0
          fi
          git config user.name "BruTTech Goalie Manager"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widgets/goalie-assignments.json
          git commit -m "Update manager-confirmed Braves goalie"
          git rebase origin/main
          git push
      - name: Read back verified published goalie from GitHub main
        if: ${{ !inputs.dry_run }}
        env:
          GAME_KEY: ${{ inputs.game_key }}
          GOALIE: ${{ inputs.goalie }}
          CUSTOM_NAME: ${{ inputs.custom_goalie_name }}
          FIXTURE_SIGNATURE: ${{ inputs.fixture_signature }}
          EXPECTED_GOALIE: ${{ inputs.expected_goalie }}
          MANAGER: ${{ github.actor }}
        run: |
          git fetch origin main
          python scripts/verify_goalie_receipt.py \
            --game-key "$GAME_KEY" --goalie "$GOALIE" \
            --custom-name "$CUSTOM_NAME" --fixture-signature "$FIXTURE_SIGNATURE" \
            --expected-goalie "$EXPECTED_GOALIE" --actor "$MANAGER" \
            --result-file build/manual-goalie-request-status.json \
            --out build/manual-goalie-receipt.json
